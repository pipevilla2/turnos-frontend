<div class="container">
  <div class="card">
    <h2>Banco Amaris · Turnos</h2>
    <p>Ingresa tu número de cédula para agendar o consultar tus turnos.</p>

    <label>Número de cédula</label>
    <input type="text" [(ngModel)]="cedula" placeholder="Ej: 1020304050" (keyup.enter)="ingresar()">
    <div class="error" *ngIf="error()">{{ error() }}</div>

    <button class="btn-primary" (click)="ingresar()" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Continuar' }}
    </button>
  </div>
</div>
